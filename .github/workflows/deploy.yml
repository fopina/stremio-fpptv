name: Deploy to Beamup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy
        uses: Stremio/beamup-deploy-action@76fe4d33120685ad4decc61ae8480fa7dbeb0a60 # v1.0.1
        with:
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          beamup_host: a.baby-beamup.club
          username_github: fopina-beamup
          project_name: fpptv
